
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini ChatGPT</title>

  <!-- MINI CHATGPT TAB ICON: No separate image needed -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%2300bfff'/%3E%3Cstop offset='1' stop-color='%230033dd'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23b)'/%3E%3Crect x='18' y='24' width='64' height='48' rx='17' fill='white'/%3E%3Crect x='24' y='30' width='52' height='36' rx='12' fill='%230d2048'/%3E%3Cpath d='M35 44 Q40 36 45 44 M55 44 Q60 36 65 44' fill='none' stroke='%2300d9ff' stroke-width='4' stroke-linecap='round'/%3E%3Cpath d='M42 54 Q50 61 58 54' fill='none' stroke='%2300d9ff' stroke-width='4' stroke-linecap='round'/%3E%3Ccircle cx='50' cy='17' r='5' fill='%2300e5ff'/%3E%3Cpath d='M63 66 H81 Q88 66 88 74 V79 Q88 86 81 86 H70 L61 92 L63 82' fill='white'/%3E%3Ccircle cx='70' cy='76' r='2' fill='%230099ff'/%3E%3Ccircle cx='76' cy='76' r='2' fill='%230099ff'/%3E%3Ccircle cx='82' cy='76' r='2' fill='%230099ff'/%3E%3C/svg%3E" type="image/svg+xml">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #212121;
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px 22px;
      border-bottom: 1px solid #3c3c3c;
      font-size: 21px;
      font-weight: bold;
    }

    #chat {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
      padding: 24px 18px 150px;
      flex: 1;
    }

    .message {
      padding: 15px 17px;
      margin: 12px 0;
      border-radius: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user { background: #343541; }
    .assistant { background: #2a2b32; }

    .label {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 6px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      background: linear-gradient(transparent, #212121 18%);
    }

    .composer {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      background: #303030;
      border: 1px solid #555;
      border-radius: 16px;
      padding: 10px;
    }

    textarea {
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      font: inherit;
      padding: 9px;
      min-height: 44px;
      max-height: 140px;
    }

    button {
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      padding: 10px 15px;
      font-weight: bold;
    }

    #send { background: #19c37d; color: #111; }
    #send:disabled { opacity: .5; cursor: wait; }
    #newChat { background: #414141; color: white; }

    .hint {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 9px;
    }

    @media(max-width: 520px) {
      header { padding: 15px; }
      #newChat { padding: 8px; }
      .composer { gap: 5px; }
    }
  </style>
</head>

<body>
  <header>
    🤖 Mini ChatGPT
    <button id="newChat" style="float:right">New chat</button>
  </header>

  <main id="chat"></main>

  <div class="bottom">
    <div class="composer">
      <textarea
        id="prompt"
        placeholder="Message Mini ChatGPT..."
        rows="1"
      ></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">
      AI can make mistakes. Check important information.
    </div>
  </div>

  <script>
    const API_URL =
      "https://mini-chatgpt-api.hemanthkumar22156.workers.dev";

    const chat = document.getElementById("chat");
    const promptBox = document.getElementById("prompt");
    const sendButton = document.getElementById("send");

    let history = [];

    addMessage(
      "assistant",
      "Vanakkam bro! 👋 I'm your Mini ChatGPT. Ask me anything in Tamil, Tanglish, or English."
    );

    function addMessage(role, content) {
      const box = document.createElement("div");
      box.className = "message " + role;

      const label = document.createElement("div");
      label.className = "label";
      label.textContent =
        role === "user" ? "You" : "Mini ChatGPT";

      const text = document.createElement("div");
      text.textContent = content;

      box.append(label, text);
      chat.appendChild(box);

      window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
      });

      return box;
    }

    async function sendMessage() {
      const message = promptBox.value.trim();

      if (!message || sendButton.disabled) return;

      addMessage("user", message);
      history.push({ role: "user", content: message });

      promptBox.value = "";
      sendButton.disabled = true;
      sendButton.textContent = "...";

      const waiting = addMessage("assistant", "Thinking...");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            messages: history
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Request failed. Please try again."
          );
        }

        const answer = data.answer || "No answer received.";

        waiting.lastElementChild.textContent = answer;

        history.push({
          role: "assistant",
          content: answer
        });

      } catch (error) {
        waiting.lastElementChild.textContent =
          "Sorry bro! " + error.message +
          "\nCloudflare Worker settings check pannunga.";

        history.pop();

      } finally {
        sendButton.disabled = false;
        sendButton.textContent = "Send";
        promptBox.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);

    promptBox.addEventListener("keydown", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("newChat").addEventListener(
      "click",
      function() {
        history = [];
        chat.innerHTML = "";

        addMessage(
          "assistant",
          "New chat started! 👋 Ask me anything in Tamil, Tanglish, or English."
        );

        promptBox.focus();
      }
    );
  </script>
</body>
</html>
